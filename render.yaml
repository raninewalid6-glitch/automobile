# Configuration Render : crée le service API automatiquement (New + -> Blueprint)
services:
  - type: web
    name: djibdrive-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # valeur à coller à la main dans Render (secrète)
      - key: JWT_SECRET
        sync: false # valeur à coller à la main dans Render (secrète)
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: COMMISSION_RATE
        value: "10"
      - key: CORS_ORIGIN
        value: https://automobilee.vercel.app
